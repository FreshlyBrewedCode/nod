<style>

:root[data-theme=light]{

  --tx:#1b1d22; --tx2:#555b68; --tx3:#8a909c;
  --need:#b5720a; --need-bg:#f2b24a2e; --know:#2a62c9; --know-bg:#2a62c91a; --bgl:#7a808c;
  --ok:#1f8a58; --ok-bg:#1f8a581a; --bad:#c93a30; --bad-bg:#c93a301a; --focus:#eef1f8; --sel:#f2b24a24;
  --shadow:0 20px 60px #0003;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono,code,kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px}
a{color:inherit;text-decoration:none}
kbd{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:17px;text-align:center;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--tx2);background:var(--panel2);font-size:10.5px}
.av{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;background:hsl(var(--h) 45% 45%);flex:none}
.av.lg{width:24px;height:24px;font-size:12px}

/* top bar */
.top{height:48px;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;font-size:14px}
.logo i{width:18px;height:18px;border-radius:5px;background:var(--need);display:grid;place-items:center;color:#111;font-style:normal;font-size:12px;font-weight:800}
.repo{color:var(--tx2)} .repo b{color:var(--tx);font-weight:500}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a{padding:5px 10px;border-radius:6px;color:var(--tx2)} .nav a.on{background:var(--panel2);color:var(--tx)}
.sp{flex:1}
.sync{color:var(--tx3);display:flex;align-items:center;gap:6px} .sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.lock{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;color:var(--tx2)}
.lock svg{width:14px;height:14px}
.lock.open{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)} .lock.open b{font-family:"JetBrains Mono",monospace;font-weight:500}
.lock.open a{color:var(--tx2);border-left:1px solid var(--line2);padding-left:8px}

/* layout */
.app{display:grid;grid-template-columns:208px 1fr 432px;height:calc(100% - 48px)}
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:18px}
.side h6{margin:0 8px 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.side a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--tx2)}
.side a.on{background:var(--panel2);color:var(--tx)}
.side a .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--tx3)}
.side a.on .n{color:var(--tx)}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.d-need{background:var(--need)} .d-know{background:var(--know)} .d-bg{background:var(--bgl)}
.keys{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;color:var(--tx3);font-size:12px;align-items:center}

.main{overflow:auto;position:relative}
.lane{padding:0 0 6px}
.lh{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:12px 16px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.lh h2{margin:0;font-size:13px;font-weight:600} .lh .c{color:var(--tx3)} .lh .hint{margin-left:auto;color:var(--tx3);font-size:12px}
.row{display:grid;grid-template-columns:22px 44px 1fr auto;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);position:relative}

.row.sel{background:var(--sel)}
.cb{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center}

.num{color:var(--tx3);font-family:"JetBrains Mono",monospace;font-size:12px}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--tx3);font-size:12px;white-space:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);font-size:11px;white-space:nowrap}
.chip.raise{border-color:#f2b24a55;color:var(--need);background:var(--need-bg)}
.chip.bad{border-color:#f0685d55;color:var(--bad);background:var(--bad-bg)}
.chip.ok{border-color:#4cc38a55;color:var(--ok);background:var(--ok-bg)}
.chip.know{border-color:#74a9ff55;color:var(--know);background:var(--know-bg)}
.rt{display:flex;align-items:center;gap:14px;color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
.ask{font-weight:600;color:var(--need);min-width:86px;text-align:right}
.ask.know{color:var(--know)}
.diff .a{color:var(--ok)} .diff .d{color:var(--bad)}
.ck{display:inline-flex;align-items:center;gap:5px;min-width:44px} .ck::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ck.run::before{background:transparent;border:1.5px solid var(--need)} .ck.fail::before{background:var(--bad)}
.age{min-width:26px;text-align:right}
.row.slim{padding:5px 16px;grid-template-columns:22px 44px 1fr auto} .row.slim .t1{font-weight:400;color:var(--tx2)}
.row.slim .st{color:var(--tx3);min-width:190px;text-align:right}

.brief{display:grid;grid-template-columns:70px 1fr;gap:7px 10px} .brief dt{color:var(--tx3)} .brief dd{margin:0;color:var(--tx)}
.brief code{color:var(--tx2)}
.fact{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.fact:last-child{border:0} .fact .k{color:var(--tx3);font-family:"JetBrains Mono",monospace;font-size:11px;display:block}
.fact .e{color:var(--tx3);font-size:12px} .fact .e.raise{color:var(--need)}

.slot.ok .s{border:0;background:var(--ok);color:#06140d} .slot.ok .s::after{content:"✓";font-weight:700}
.slot.stale .s{border:0;background:var(--bad);color:#fff} .slot.stale .s::after{content:"!";font-weight:700}

.card>h6{margin:0 0 12px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600;display:flex;gap:8px;align-items:center}

.lcard.sel{border-color:#f2b24a66} .lcard h3{margin:0 0 6px;font-size:15px}

</style>

    <section class="lane"><div class="lh"><span class="dot d-need"></span><h2>Needs you</h2><span class="c">${needs.length}</span><span class="hint">agents are waiting on these · oldest 5h</span></div>${needs.map(p => row(p, st)).join('')}</section>
    <section class="lane"><div class="lh"><span class="dot d-know"></span><h2>Worth knowing</h2><span class="c">${know.length}</span><span class="hint">no input wanted · <kbd>a</kbd> to ack</span></div>${know.map(p => row(p, st)).join('')}</section>
    <section class="lane"><div class="lh"><span class="dot d-bg"></span><h2>Background</h2><span class="c">${bg.length}</span><span class="hint">nothing to do · 5 merged without a human since yesterday 17:42</span></div>${bg.map(p => slim(p, st.signed)).join('')}</section>
    ${st.sel ? `<div class="selbar"><b>${st.sel.length} selected</b><span style="color:var(--tx2)">2 as peer · 2 self-attest · 1 re-attest</span><a class="btn ghost">Clear <kbd>esc</kbd></a><a class="btn pri" href="#batch">Review &amp; sign ${st.sel.length} <kbd>s</kbd></a></div>` : ''}
  </main>${st.right || preview(PR(st.focus))}</div>${st.modal || ''}`;
}
const reviewModal = () => `<div class="scrim"><div class="modal">
  <div class="mh"><h2>You are about to sign 5 pull requests</h2><p>One signature per PR, each bound to the exact content below. Nothing is posted until you unlock and sign.</p></div>
  <div class="mb">
  <div class="sum"><div><b>2</b><span>as peer (Jonas' PRs)</span></div><div><b>3</b><span>as prompter (your PRs)</span></div><div><b style="color:var(--ok)">4</b><span>become mergeable by agents</span></div><div><b style="color:var(--need)">1</b><span>still waits on someone else</span></div></div>
  <table><tr><th></th><th>Pull request</th><th>Signing as</th><th>Head · patch-id</th><th>After you sign</th></tr>
  ${BATCH.map(n => { const p = PR(n); return `<tr><td><span class="cb on"></span></td><td><b>#${n}</b> ${esc(p.title)}<div class="t2">${av(p.by)}${PEOPLE[p.by].short} · ${chips(p)}${diff(p)}</div></td>
    <td>${KIND[p.askKind]}</td><td class="mono">${p.sha}<br>${p.patch}</td><td><span class="aft ${AFTER[n][0]}">${AFTER[n][1]}</span></td></tr>`; }).join('')}</table>
  <div class="pay mono">verdict: approve · signed with ssh-keygen -Y sign, posted as one comment per PR\n${payload(482)}\n… 4 more</div>
  </div>
  <div class="mf"><span class="k">Key ${KEYFP} · published at github.com/mara-l.keys</span><span class="sp"></span><a class="btn ghost" href="#dashboard">Cancel <kbd>esc</kbd></a><a class="btn pri big" href="#unlock">${LOCK.replace('<svg', '<svg width="15" height="15"')} Unlock &amp; sign 5 <kbd>↵</kbd></a></div>
</div></div>`;
const unlockModal = () => `<div class="scrim"><div class="modal unlock">
  <div class="mh"><h2>Unlock signing key</h2><p>To sign 5 pull requests as mara-l.</p></div>
  <div class="mb"><div class="note" style="margin-bottom:6px">Passphrase for ~/.ssh/id_ed25519_sign</div><div class="field">••••••••••••••</div>
    <div class="note" style="margin:14px 0 0">Keep unlocked for</div><div class="opt"><span>this batch only</span><span class="on">15 min</span><span>1 hour</span></div>
    <p class="note" style="margin:14px 0 0">The key stays inside this app, never in ssh-agent. While unlocked, the timer is shown in the top bar and every signature still needs a click from this browser tab.</p></div>
  <div class="mf"><span class="k">${KEYFP}</span><span class="sp"></span><a class="btn ghost" href="#batch">Back</a><a class="btn pri" href="#signed">Sign 5 <kbd>↵</kbd></a></div>
</div></div>`;
const receipt = () => `<aside class="pv"><div class="toast"><h3>Signed 5 pull requests</h3>Attestation comments posted 14:21. The verifier has re-checked 4 of 5.</div>
  <div class="sec"><h6>Receipt</h6>${BATCH.map(n => `<div class="rc"><span class="num">#${n}</span><div>${esc(PR(n).title)}<br><small>${KIND[PR(n).askKind]} · <span class="mono">${PR(n).sha}</span> · comment ↗</small></div>
    <span class="chip ${n === 485 ? 'raise' : n === 491 ? '' : 'ok'}">${n === 485 ? 'waits on Jonas' : n === 491 ? 'verifier pending' : 'check green'}</span></div>`).join('')}</div>
  <div class="sec"><h6>What happens now</h6><p class="note" style="margin:0">Agents merge #482, #488 and #490 on their own (auto-merge is on). #485 needs Jonas' self-attest; he sees it in his lane. A rebase keeps your signature valid, a content change brings the PR back to "Needs you".</p></div>
  <div style="display:flex;gap:8px;margin-top:16px"><a class="btn">Revoke a signature…</a><a class="btn ghost" href="#dashboard">Next: #476 <kbd>j</kbd></a></div></aside>`;

function detail() {
  const p = PR(476);
  return topbar() + `<div class="page"><div class="wrap">
  <div class="crumb"><a href="#dashboard">← Triage</a><span>/</span><span>Needs you</span><span>/</span><span>3 of 6</span><span class="sp"></span><kbd>k</kbd><kbd>j</kbd><span>previous / next</span></div>
  <h1><span style="color:var(--tx3);font-weight:500">#476</span> ${esc(p.title)}</h1>
  <div class="meta"><span class="chip raise">decide</span><span class="chip raise">touches core</span><span class="chip raise">security-sensitive</span>${av('jonas')}<span>prompted by Jonas · ${p.agent}</span>
    <span class="mono">agent/auth-rotate → main</span>${diff(p)}<span>${p.files} files</span>${ck(p)}<span>opened 5h ago</span><span style="margin-left:auto">Open on GitHub ↗</span></div>
  <div class="cols"><div>
    <div class="card"><h6>Brief <span>from the PR body, written by the agent</span></h6><dl class="brief">
      <dt>What</dt><dd>${p.brief.what}</dd><dt>Why</dt><dd>${p.brief.why}</dd><dt>Risk</dt><dd>${risk(3)}${p.brief.risk}</dd><dt>Verified</dt><dd>${p.brief.verified}</dd>
      <dt>Look at</dt><dd>${p.brief.look.map(f => `<code>${f}</code>`).join(' · ')}</dd></dl></div>
    <div class="card"><h6>Files <span>7 changed · tagged by classifier</span></h6>
      ${p.filesList.map(f => `<div class="frow"><span class="mono" style="color:var(--tx)">${f[0]}</span><span><span class="chip ${f[3].startsWith('core') ? 'raise' : ''}">${f[3]}</span></span><span class="diff"><span class="a">+${f[1]}</span> <span class="d">−${f[2]}</span></span>
        <span class="bar"><i style="width:${f[1] / 1.1}%"></i><b style="width:${f[2] / 1.1}%"></b></span></div>`).join('')}</div>
    <div class="card"><h6>Activity <span>from GitHub comments and reactions</span></h6>
      <div class="ev"><span class="bot">CS</span><div><b>countersign-verifier</b> <span class="w">sticky comment · updated 2h ago</span><p>Category <b>decide</b> · needs prompter self-attest + named owner (Mara). 1 of 2 attestations valid. Check <span class="mono">human-attestation</span> pending.</p></div></div>
      <div class="ev">${av('jonas', 'lg')}<div><b>jonas-r</b> <span class="w">signed attestation · yesterday 16:12</span><p>approve · level self · <span class="mono">head 5e0a91c · patch-id 3fa9c1e7</span> · signature verified against github.com/jonas-r.keys</p></div></div>
      <div class="ev"><span class="bot">GH</span><div><b>Rebased onto main</b> <span class="w">force-push · today 09:05</span><p><span class="mono">5e0a91c → d2c47fa</span>, patch-id unchanged. Jonas' attestation still counts.</p></div></div>
      <div class="ev">${av('ines', 'lg')}<div><b>inescal</b> <span class="w">reacted <span class="mono">:eyes:</span> on the verifier comment · today 10:30</span><p>FYI acknowledged.</p></div></div>
    </div>
  </div><div>
    <div class="card me"><h6>Requirement <span>1 of 2 met</span></h6>${p.slots.map(slot).join('')}
      <div style="display:flex;gap:8px;margin-top:12px"><a class="btn pri big" href="#unlock">${LOCK.replace('<svg', '<svg width="15" height="15"')} Sign as owner <kbd>s</kbd></a><a class="btn big">Add to batch <kbd>x</kbd></a></div>
      <p class="note" style="margin:10px 0 0">You sign <span class="mono">d2c47fa</span> / patch-id <span class="mono">3fa9c1e7</span>. After that the check turns green and Jonas' agent may merge.</p></div>
    <div class="card"><h6>Why this needs you <span>policy @ main</span></h6>
      ${p.facts.map(f => `<div class="fact"><div><span class="k">${f.k}</span>${f.fact}</div><span class="e ${f.raise ? 'raise' : ''}">${f.raise ? '↑ ' : ''}${f.effect}</span></div>`).join('')}
      <div class="flow">rule <b class="mono">core-change</b> → category <b>decide</b> → <b>prompter + named owner</b></div></div>
    <div class="card"><h6>FYI acks <span>policy: core/auth change</span></h6>
      <div class="slot ok"><span class="s"></span><div><b>Ines</b><small><span class="mono">:eyes:</span> reaction, today 10:30</small></div></div>
      <div class="slot"><span class="s"></span><div><b>You</b><small>your signature counts as ack</small></div></div>
      <p class="note" style="margin:8px 0 0">Jonas is the prompter. Acks are unsigned and never block the merge.</p></div>
  </div></div></div></div>`;
}
function link() {
  return topbar() + `<div class="page"><div class="wrap" style="max-width:1180px">
  <div class="banner"><div><b>Opened from a link.</b> Posted by jonas-r (Claude Code) in a comment on #482, 38 min ago: "Billing v2 and the auth fix are ready for a second pair of eyes."<br><span class="note">Nothing is signed yet. A link only opens this view; signing needs your key.</span></div><a class="x" href="#dashboard">Go to triage instead →</a></div>
  <div class="cols" style="grid-template-columns:1fr 380px;margin-top:0"><div>
  ${LINK.map(n => { const p = PR(n), mv = p.moved; return `<div class="lcard ${mv ? '' : 'sel'}"><span class="cb ${mv ? '' : 'on'}" style="margin-top:3px"></span><div>
    <div class="meta"><span class="num">#${n}</span>${chips(p)}${diff(p)}<span>${p.files} files</span>${ck(p)}<span style="margin-left:auto;color:var(--need);font-weight:600">${p.ask}</span></div>
    <h3 style="margin-top:6px">${esc(p.title)}</h3>
    <dl class="brief"><dt>What</dt><dd>${p.brief.what}</dd><dt>Risk</dt><dd>${risk(p.brief.riskLvl)}${p.brief.risk}</dd><dt>Verified</dt><dd>${p.brief.verified}</dd></dl>
    ${mv ? `<div class="warn"><b>Changed since the link was posted.</b> Head moved <span class="mono">${mv.from} → ${p.sha}</span> (${mv.commits} new commits, patch-id differs). Not preselected. <a style="text-decoration:underline">See what changed</a></div>` : ''}
    <div class="meta" style="margin-top:10px"><a style="text-decoration:underline">Full view</a><a style="text-decoration:underline">Diff on GitHub ↗</a><span>requirement: ${p.req}</span></div></div></div>`; }).join('')}
  </div><div><div class="card me" style="position:sticky;top:0"><h6>Requested batch <span>2 of 3 selected</span></h6>
    <div class="rc" style="border:0"><span class="num">#482</span><div>as peer<br><small class="mono">9f3c2ab</small></div><span class="chip ok">→ mergeable</span></div>
    <div class="rc"><span class="num">#476</span><div>as owner of core/auth<br><small class="mono">d2c47fa</small></div><span class="chip ok">→ mergeable</span></div>
    <div class="rc" style="opacity:.55"><span class="num">#485</span><div>not selected<br><small>changed after the request</small></div><span class="chip">skipped</span></div>
    <a class="btn pri big" href="#unlock" style="width:100%;justify-content:center;margin-top:12px">${LOCK.replace('<svg', '<svg width="15" height="15"')} Review &amp; sign 2 <kbd>s</kbd></a>
    <p class="note" style="margin:10px 0 0">Signing is locked. You will see the exact payload and enter your passphrase before anything is posted.</p></div></div></div>
  </div></div>`;
}
function render() {
  const r = route(), root = document.getElementById('root');
  const signed = { 482: 'signed just now · agent is merging', 488: 'signed just now · agent is merging', 490: 'signed just now · auto-merge queued', 491: 'signed just now · verifier pending', 485: 'signed by you · waits on Jonas' };
  root.innerHTML = r === 'detail' ? detail() : r === 'link' ? link() :
    r === 'batch' ? dashboard({ focus: 482, sel: BATCH, modal: reviewModal() }) :
    r === 'unlock' ? dashboard({ focus: 482, sel: BATCH, modal: unlockModal() }) :
    r === 'signed' ? dashboard({ focus: 476, signed, open: '14:48', right: receipt() }) :
    r === 'selected' ? dashboard({ focus: 482, sel: BATCH }) : dashboard({ focus: 482 });
}
addEventListener('hashchange', render); render();
</script>
