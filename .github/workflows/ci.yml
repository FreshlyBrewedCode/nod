name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run check

      # The web app the release workflow deploys to ui.nod.frebreco.de.
      - run: bun run build

      # Stages and smoke-tests the npm package with a placeholder version, so a
      # staging failure is caught here rather than in the release job.
      - name: Stage the release package
        run: bun scripts/build-release.ts 0.0.0-development --smoke-test

  # `site/` is its own package; this proves a PR still builds the site that
  # site.yml deploys once it is switched on. `build:channels` is what site.yml
  # runs: here, without release tags, both channels come from the checkout,
  # and under `/nod`, as the project page is served until it has its domain.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
        working-directory: site

      - run: bun run check
        working-directory: site

      - run: bun run build:channels
        working-directory: site
        env:
          SITE_ORIGIN: https://freshlybrewedcode.github.io
          SITE_BASE: /nod
