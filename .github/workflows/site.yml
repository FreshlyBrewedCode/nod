name: site

# Deploys the landing page and the docs (site/) to the GitHub Pages site of
# this repository.
#
# It has its own switch, apart from the releases' RELEASE_ENABLED: both jobs
# are skipped, not failed, unless the repository variable SITE_ENABLED is
# `true`. It also needs GitHub Pages enabled on this repo with "GitHub
# Actions" as the source (docs/release.md, the `site` phase of
# scripts/bootstrap-release.sh):
#   gh api --method POST repos/FreshlyBrewedCode/nod/pages -f build_type=workflow
#   gh variable set SITE_ENABLED --body true --repo FreshlyBrewedCode/nod
#   gh workflow run site.yml --repo FreshlyBrewedCode/nod --ref main
#
# Where it is served is a Pages setting, not code: the build takes its origin
# and base path from `actions/configure-pages`. Without a custom domain that
# is the project page https://freshlybrewedcode.github.io/nod/ (base `/nod`);
# once the custom domain nod.frebreco.de is set in the Pages settings it is
# the domain root (base empty), from the next run on.
#
# `site/` is its own package (own `bun.lock`, own `node_modules`), not a
# workspace of the root, so this workflow only ever touches that directory,
# never `bun install`/`bun run check` at the repo root.
#
# The docs come in two channels, like the package (site/src/lib/channel.ts):
# the root documents the last stable release (its tag's `site/content/`), and
# `/next` documents main. Both change with a release (a stable one moves the
# root, any one the versions the picker shows), so this runs after every run
# of release.yml, which every push to main starts, rather than on pushes.
# A release run whose jobs were all skipped (RELEASE_ENABLED unset) completes
# too and starts this one: no condition on its conclusion.
# Before the first stable release both channels are built from main
# (site/scripts/build-channels.sh).

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer push win rather than queue
# behind a stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.SITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Main, with the release tags: the stable content comes from one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
        working-directory: site

      # Where Pages serves this repo: the origin and, for a project page, the
      # folder (`/nod`; empty under a custom domain).
      - uses: actions/configure-pages@v5
        id: pages

      # Both channels into dist/, each with its own search index.
      - run: bun run build:channels
        working-directory: site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: vars.SITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
